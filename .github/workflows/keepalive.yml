name: Keepalive Supabase

on:
  schedule:
    - cron: "0 1 */3 * *"   # tiap 3 hari, jam 01:00 UTC (09:00 WITA)
  workflow_dispatch:         # tombol "Run workflow" manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database Supabase
        run: |
          RESP=$(curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/profil_sekolah?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Respon: $RESP"
          echo "OK: Supabase aktif $(date)"
